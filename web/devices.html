<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex · 选择设备</title>
<style>
:root{color-scheme:light dark;font:16px/1.5 system-ui,sans-serif}body{max-width:30rem;margin:12vh auto;padding:0 1.25rem}h1{font-size:1.6rem}button{font:inherit;color:inherit;border:1px solid GrayText;border-radius:.65rem;background:transparent;cursor:pointer;padding:.7rem .9rem}#devices button{display:flex;align-items:center;justify-content:space-between;width:100%;margin:.5rem 0;text-align:left;gap:1rem}button:disabled{opacity:.55;cursor:default}small{display:block;color:GrayText;overflow-wrap:anywhere}#status{min-height:1.5rem}
</style>
<h1>选择 Codex 主机</h1><p id="status" role="status"></p><div id="devices"></div><button id="refresh">刷新设备</button>
<script>
const statusLine=document.querySelector('#status'),list=document.querySelector('#devices'),refresh=document.querySelector('#refresh');
const remembered='codex-receiver-selected-device';
let refreshAfterLoad=false,firstResult=true,timer;
const rows=new Map();
function receiverAuthorized(){if(refresh.disabled)refreshAfterLoad=true;else void load()}
async function load(){
 clearTimeout(timer);
 if(refresh.disabled)return;
 refresh.disabled=true;if(firstResult)statusLine.textContent='正在获取已授权设备…';
 try{
  const response=await fetch('/api/devices',{method:'POST'}),data=await response.json();
  if(!response.ok)throw Error(data.error||'无法获取设备');
  const last=localStorage.getItem(remembered),devices=data.devices;
  const saved=devices.find(device=>device.deviceId===last);
  const restore=firstResult;firstResult=false;
  if(restore&&saved?.online===true&&location.pathname==='/'&&!location.hash){
    statusLine.textContent='正在打开 '+(saved.name||saved.deviceId)+'…';
    location.replace('/devices/'+saved.scope+'/');return
  }
  statusLine.textContent=!devices.length?'当前账号暂无已授权设备':last&&!saved?'上次使用的设备已不在授权列表中。':location.hash==='#directory-unavailable'?'设备列表已恢复，请重新选择主机。':'';
  const ids=new Set(devices.map(device=>device.deviceId));
  for(const [id,button] of rows)if(!ids.has(id)){button.remove();rows.delete(id)}
  const names=new Map();
  for(const device of devices)names.set(device.name,(names.get(device.name)||0)+1);
  for(const [index,device] of devices.entries()){
   let button=rows.get(device.deviceId);
   if(!button){
    button=document.createElement('button');
    button.append(document.createElement('span'),document.createElement('small'));
    rows.set(device.deviceId,button)
   }
   const [name,state]=button.children;
   name.textContent=device.name||device.deviceId;
   if(names.get(device.name)>1){
    const id=document.createElement('small');id.textContent=device.deviceId;name.append(id)
   }
   state.textContent=(device===saved?'上次使用 · ':'')+(device.online===true?'在线':device.online===false?'离线':'状态未知');
   button.disabled=device.online===false;
   button.onclick=()=>{
    statusLine.textContent='正在打开 '+(device.name||device.deviceId)+'…';
    localStorage.setItem(remembered,device.deviceId);
    if(location.pathname==='/')history.replaceState(null,'','/devices');
    location.assign('/devices/'+device.scope+'/')
   };
   if(list.children[index]!==button)list.insertBefore(button,list.children[index]||null)
  }
 }catch(e){
  statusLine.textContent=e.message;
  for(const button of rows.values()){button.disabled=true;button.lastElementChild.textContent='待确认'}
 }finally{
  refresh.disabled=false;
  if(refreshAfterLoad){refreshAfterLoad=false;void load()}
  else if(!document.hidden)timer=setTimeout(load,15000)
 }
}
refresh.onclick=load;
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else receiverAuthorized()});
window.addEventListener('pageshow',event=>{if(event.persisted)receiverAuthorized()});
window.addEventListener('pagehide',()=>clearTimeout(timer));
load();
</script></html>
